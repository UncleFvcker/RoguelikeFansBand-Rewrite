<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151d" />
    <title data-l10n-id="app-title"></title>
  </head>
  <body>
    <main id="session-shell" class="session-shell" data-view="title">
      <section class="session-card" aria-labelledby="session-heading">
        <p class="eyebrow" data-l10n-id="session-eyebrow"></p>
        <h1 id="session-heading" data-l10n-id="session-heading"></h1>
        <p class="session-subtitle" data-l10n-id="session-subtitle"></p>

        <section id="session-title-view" class="session-view">
          <div class="session-primary-actions">
            <button id="session-new-game" class="primary-button" type="button" data-l10n-id="action-session-new-game"></button>
            <button id="session-continue" type="button" data-l10n-id="action-session-continue"></button>
            <button id="session-load-game" type="button" data-l10n-id="action-session-load-game"></button>
          </div>
          <div class="session-secondary-actions">
            <button id="session-settings" class="quiet-button" type="button" data-l10n-id="action-session-settings"></button>
            <button id="session-exit" class="quiet-button" type="button" data-l10n-id="action-session-exit"></button>
          </div>
        </section>

        <form id="session-new-game-view" class="session-view" hidden>
          <div class="session-view-heading">
            <h2 data-l10n-id="session-new-game-heading"></h2>
            <p data-l10n-id="session-demo-build-notice"></p>
          </div>
          <fieldset class="session-builds">
            <legend data-l10n-id="session-build-label"></legend>
            <label class="session-build-card recommended">
              <input id="session-build-explorer" type="radio" name="session-build" value="demo.build.explorer" checked />
              <span class="session-build-heading">
                <strong data-l10n-id="build-demo-explorer-name"></strong>
                <span data-l10n-id="session-build-recommended"></span>
              </span>
              <span data-l10n-id="build-demo-explorer-description"></span>
              <small data-l10n-id="session-build-temporary"></small>
            </label>
            <label class="session-build-card">
              <input id="session-build-vanguard" type="radio" name="session-build" value="demo.build.vanguard" />
              <span class="session-build-heading">
                <strong data-l10n-id="build-demo-vanguard-name"></strong>
              </span>
              <span data-l10n-id="build-demo-vanguard-description"></span>
              <small data-l10n-id="session-build-temporary"></small>
            </label>
            <label class="session-build-card">
              <input id="session-build-scholar" type="radio" name="session-build" value="demo.build.scholar" />
              <span class="session-build-heading">
                <strong data-l10n-id="build-demo-scholar-name"></strong>
              </span>
              <span data-l10n-id="build-demo-scholar-description"></span>
              <small data-l10n-id="session-build-temporary"></small>
            </label>
          </fieldset>
          <label class="session-seed" for="session-seed">
            <span data-l10n-id="session-seed-label"></span>
            <span class="session-seed-controls">
              <input id="session-seed" type="text" inputmode="numeric" autocomplete="off" />
              <button id="session-randomize-seed" type="button" data-l10n-id="action-session-randomize-seed"></button>
            </span>
            <small data-l10n-id="session-seed-help"></small>
          </label>
          <div class="session-form-actions">
            <button id="session-new-game-back" type="button" data-l10n-id="action-session-back"></button>
            <button id="session-start-game" class="primary-button" type="submit" data-l10n-id="action-session-start-game"></button>
          </div>
        </form>

        <section id="session-load-view" class="session-view" hidden>
          <div class="session-view-heading session-view-heading-row">
            <div>
              <h2 data-l10n-id="session-load-heading"></h2>
              <p data-l10n-id="session-load-description"></p>
            </div>
            <button id="session-load-refresh" class="quiet-button" type="button" data-l10n-id="action-native-save-refresh"></button>
          </div>
          <ul id="session-load-list" class="native-save-list session-load-list" aria-live="polite"></ul>
          <div class="session-form-actions">
            <button id="session-load-back" type="button" data-l10n-id="action-session-back"></button>
          </div>
        </section>

        <section id="session-settings-view" class="session-view" hidden>
          <div class="session-view-heading">
            <h2 data-l10n-id="session-settings-heading"></h2>
            <p data-l10n-id="session-settings-description"></p>
          </div>
          <div class="session-settings-grid">
            <label for="session-settings-language">
              <span data-l10n-id="settings-language-label"></span>
              <select id="session-settings-language">
                <option value="en-US" data-l10n-id="language-name-en-us"></option>
                <option value="zh-CN" data-l10n-id="language-name-zh-cn"></option>
              </select>
            </label>
            <label for="session-settings-input">
              <span data-l10n-id="settings-input-label"></span>
              <select id="session-settings-input">
                <option value="numpad" data-l10n-id="input-preset-numpad"></option>
                <option value="vi" data-l10n-id="input-preset-vi"></option>
                <option value="wasd" data-l10n-id="input-preset-wasd"></option>
              </select>
            </label>
          </div>
          <div class="session-form-actions">
            <button id="session-settings-back" type="button" data-l10n-id="action-session-back"></button>
          </div>
        </section>

        <p id="session-status" class="session-status" aria-live="polite"></p>
        <p id="session-error" class="session-error" aria-live="assertive"></p>
      </section>
    </main>

    <div id="app" hidden>
      <header class="app-header">
        <div>
          <p class="eyebrow" data-l10n-id="app-eyebrow"></p>
          <h1 data-l10n-id="app-heading"></h1>
          <p class="run-metadata">
            <span data-l10n-id="run-build-label"></span>
            <strong id="run-build-value">--</strong>
            <span aria-hidden="true" data-l10n-id="run-metadata-separator"></span>
            <span data-l10n-id="run-seed-label"></span>
            <strong id="run-seed-value">--</strong>
          </p>
        </div>
        <div class="header-actions">
          <button id="replay-button" type="button" data-l10n-id="action-export-replay"></button>
          <button id="save-button" type="button" data-l10n-id="action-export-save"></button>
          <label class="file-button">
            <span data-l10n-id="action-load-save"></span>
            <input id="load-input" type="file" accept=".rfbsave,application/octet-stream" />
          </label>
        </div>
      </header>

      <section id="journey-panel" class="journey-panel" aria-labelledby="journey-panel-title">
        <div class="journey-objective">
          <div class="panel-heading journey-heading">
            <span id="journey-panel-title" data-l10n-id="panel-journey-title"></span>
            <span id="journey-location" class="journey-location"></span>
          </div>
          <p class="journey-label" data-l10n-id="journey-primary-objective-label"></p>
          <h2 id="journey-objective-title"></h2>
          <p id="journey-objective-detail"></p>
        </div>
        <div class="onboarding-card" aria-live="polite">
          <div class="onboarding-meta">
            <span id="onboarding-kind" class="onboarding-kind"></span>
            <span id="onboarding-progress"></span>
          </div>
          <h3 id="onboarding-title"></h3>
          <p id="onboarding-detail"></p>
          <p id="onboarding-control" class="onboarding-control"></p>
          <div class="onboarding-settings">
            <label for="onboarding-hide-optional">
              <input id="onboarding-hide-optional" type="checkbox" />
              <span data-l10n-id="onboarding-hide-optional-label"></span>
            </label>
            <button id="onboarding-reset" class="quiet-button" type="button" data-l10n-id="action-onboarding-reset"></button>
          </div>
        </div>
      </section>

      <main class="game-layout">
        <section class="map-panel" data-l10n-aria-label="map-aria-label">
          <div class="panel-heading">
            <span data-l10n-id="panel-map-title"></span>
            <span id="connection-status" class="status-pill"></span>
          </div>
          <div id="map-host" class="map-host">
            <div id="target-cursor" class="target-cursor" aria-hidden="true" hidden></div>
          </div>
          <div class="input-toolbar">
            <div class="target-controls">
              <button id="look-mode-toggle" type="button"></button>
              <button id="target-mode-toggle" type="button"></button>
              <span id="target-mode-status" aria-live="polite"></span>
            </div>
            <label for="input-preset">
              <span data-l10n-id="settings-input-label"></span>
              <select id="input-preset">
                <option value="numpad" data-l10n-id="input-preset-numpad"></option>
                <option value="vi" data-l10n-id="input-preset-vi"></option>
                <option value="wasd" data-l10n-id="input-preset-wasd"></option>
              </select>
            </label>
            <label for="tileset-preset">
              <span data-l10n-id="settings-tileset-label"></span>
              <select id="tileset-preset">
                <option value="ascii" data-l10n-id="tileset-ascii"></option>
                <option value="image" data-l10n-id="tileset-image"></option>
              </select>
            </label>
            <label for="camera-mode">
              <span data-l10n-id="settings-camera-label"></span>
              <select id="camera-mode">
                <option value="full-map" data-l10n-id="camera-full-map"></option>
                <option value="player-centered" data-l10n-id="camera-player-centered"></option>
              </select>
            </label>
            <label for="zoom-level">
              <span data-l10n-id="settings-zoom-label"></span>
              <select id="zoom-level">
                <option value="0.75" data-l10n-id="zoom-75"></option>
                <option value="1" data-l10n-id="zoom-100"></option>
                <option value="1.25" data-l10n-id="zoom-125"></option>
                <option value="1.5" data-l10n-id="zoom-150"></option>
                <option value="2" data-l10n-id="zoom-200"></option>
              </select>
            </label>
            <label for="language-select">
              <span data-l10n-id="settings-language-label"></span>
              <select id="language-select">
                <option value="en-US" data-l10n-id="language-name-en-us"></option>
                <option value="zh-CN" data-l10n-id="language-name-zh-cn"></option>
              </select>
            </label>
            <p id="controls-help" class="controls"></p>
          </div>
        </section>

        <aside class="ui-column">
          <section class="status-panel" aria-labelledby="status-title">
            <div class="panel-heading">
              <span id="status-title" data-l10n-id="panel-status-title"></span>
            </div>
            <dl class="status-grid">
              <div><dt data-l10n-id="status-turn"></dt><dd id="turn-value">0</dd></div>
              <div><dt data-l10n-id="status-health"></dt><dd id="hp-value">--</dd></div>
              <div><dt data-l10n-id="status-attack"></dt><dd id="attack-value">--</dd></div>
              <div><dt data-l10n-id="status-defense"></dt><dd id="defense-value">--</dd></div>
              <div><dt data-l10n-id="status-effects"></dt><dd id="effects-value">--</dd></div>
              <div><dt data-l10n-id="status-position"></dt><dd id="position-value">--</dd></div>
              <div><dt data-l10n-id="status-hash"></dt><dd id="hash-value">--</dd></div>
            </dl>
          </section>

          <section class="status-panel progression-panel" aria-labelledby="progression-title">
            <div class="panel-heading">
              <span id="progression-title" data-l10n-id="panel-progression-title"></span>
            </div>
            <dl class="status-grid">
              <div><dt data-l10n-id="progression-level"></dt><dd id="progression-level-value">--</dd></div>
              <div><dt data-l10n-id="progression-experience"></dt><dd id="progression-experience-value">--</dd></div>
              <div><dt data-l10n-id="progression-cap"></dt><dd id="progression-cap-value">--</dd></div>
              <div><dt data-l10n-id="progression-points"></dt><dd id="progression-points-value">--</dd></div>
              <div><dt data-l10n-id="progression-build"></dt><dd id="progression-build-value">--</dd></div>
              <div><dt data-l10n-id="progression-race"></dt><dd id="progression-race-value">--</dd></div>
              <div><dt data-l10n-id="progression-class"></dt><dd id="progression-class-value">--</dd></div>
              <div><dt data-l10n-id="progression-personality"></dt><dd id="progression-personality-value">--</dd></div>
              <div><dt data-l10n-id="progression-multipliers"></dt><dd id="progression-multipliers-value">--</dd></div>
            </dl>
            <ul id="attribute-list" class="attribute-list" aria-live="polite"></ul>
            <div class="progression-subheading" data-l10n-id="progression-skills"></div>
            <ul id="skill-list" class="skill-list" aria-live="polite"></ul>
          </section>

          <section class="status-panel ability-panel" aria-labelledby="ability-title">
            <div class="panel-heading">
              <span id="ability-title" data-l10n-id="panel-ability-title"></span>
              <button id="resource-rest" class="quiet-button" type="button" data-l10n-id="action-resource-rest"></button>
            </div>
            <ul id="resource-list" class="resource-list" aria-live="polite"></ul>
            <ul id="ability-list" class="ability-list" aria-live="polite"></ul>
          </section>

          <section class="status-panel summon-command-panel" aria-labelledby="summon-command-title">
            <div class="panel-heading">
              <span id="summon-command-title" data-l10n-id="panel-summon-command-title"></span>
              <span id="summon-command-status" class="status-pill"></span>
            </div>
            <div class="summon-command-actions">
              <button id="summon-command-follow" type="button" data-l10n-id="action-summon-command-follow"></button>
              <button id="summon-command-attack" type="button" data-l10n-id="action-summon-command-attack"></button>
              <button id="summon-command-keep-distance" type="button" data-l10n-id="action-summon-command-keep-distance"></button>
              <button id="summon-command-guard" type="button" data-l10n-id="action-summon-command-guard"></button>
            </div>
          </section>

          <section class="status-panel" aria-labelledby="campaign-title">
            <div class="panel-heading">
              <span id="campaign-title" data-l10n-id="panel-campaign-title"></span>
            </div>
            <dl class="status-grid">
              <div><dt data-l10n-id="campaign-status-label"></dt><dd id="campaign-status-value">--</dd></div>
              <div><dt data-l10n-id="campaign-score-label"></dt><dd id="campaign-score-value">0</dd></div>
              <div><dt data-l10n-id="campaign-dungeons-label"></dt><dd id="campaign-dungeons-value">0</dd></div>
              <div><dt data-l10n-id="campaign-tasks-label"></dt><dd id="campaign-tasks-value">0</dd></div>
            </dl>
            <button id="campaign-retire" type="button" data-l10n-id="action-campaign-retire"></button>
          </section>

          <section class="inventory-panel" aria-labelledby="task-log-title">
            <div class="panel-heading">
              <span id="task-log-title" data-l10n-id="panel-task-log-title"></span>
            </div>
            <ul id="task-log-list" class="inventory-list" aria-live="polite"></ul>
          </section>

          <section class="inventory-panel" aria-labelledby="inventory-title">
            <div class="panel-heading">
              <span id="inventory-title" data-l10n-id="panel-inventory-title"></span>
              <span id="inventory-count"></span>
            </div>
            <div class="inventory-actions">
              <span id="inventory-selection-count"></span>
              <div class="inventory-action-controls">
                <label class="inventory-drop-quantity" for="inventory-drop-quantity">
                  <span data-l10n-id="inventory-drop-quantity-label"></span>
                  <input id="inventory-drop-quantity" type="number" min="1" step="1" inputmode="numeric" />
                </label>
                <button id="inventory-use" type="button" data-l10n-id="action-inventory-use"></button>
                <button id="inventory-appraise" type="button" data-l10n-id="action-inventory-appraise"></button>
                <button id="inventory-equip" type="button" data-l10n-id="action-inventory-equip"></button>
                <button id="inventory-drop" type="button" data-l10n-id="action-inventory-drop"></button>
              </div>
            </div>
            <ul id="inventory-list" class="inventory-list" aria-live="polite"></ul>
            <div class="equipment-heading" data-l10n-id="panel-equipment-title"></div>
            <ul id="equipment-list" class="equipment-list" aria-live="polite"></ul>
          </section>

          <section class="save-panel" aria-labelledby="native-save-title">
            <div class="panel-heading">
              <span id="native-save-title" data-l10n-id="panel-native-save-title"></span>
              <button id="native-save-refresh" class="quiet-button" type="button" data-l10n-id="action-native-save-refresh"></button>
            </div>
            <div class="native-save-create">
              <label for="native-save-name" data-l10n-id="native-save-name-label"></label>
              <div>
                <input id="native-save-name" type="text" maxlength="80" />
                <button id="native-save-create" type="button" data-l10n-id="action-native-save-create"></button>
              </div>
            </div>
            <ul id="native-save-list" class="native-save-list" aria-live="polite"></ul>
          </section>

          <section class="message-panel" aria-labelledby="message-title">
            <div class="panel-heading">
              <span id="message-title" data-l10n-id="panel-message-title"></span>
              <button id="clear-messages" class="quiet-button" type="button" data-l10n-id="action-clear-messages"></button>
            </div>
            <ol id="message-list" class="message-list" aria-live="polite"></ol>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
